<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цахим хичээл - Peace Education</title>
    <link rel="stylesheet" href="Online_Course_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
</head>
<body>

<div id="header"></div>

<section id="registrations">
    <h1>Нэвтрэх</h1>
    <p class="registrations-label">Цахим хичээлийг үзэхийн тулд та өөрийн хэрэглэгчийн бүртгэлээр нэвтэрнэ үү.</p>
    <div class="registrations-grid">

        <!-- login -->
        <a href="login.html" class="registrations-card">
            <img src="Online_Course/login.png" alt="Lesson 1">
            <div class="registrations-content">
                <h2>Log in</h2>
                <p class="registrations-text">нэвтрэх</p>
                <span class="registrations-btn">Нэвтрэх</span>
            </div>
        </a>

        <!-- sign up -->
        <a href="register.html" class="registrations-card">
            <img src="Online_Course/sign-up.png" alt="Lesson 1">
            <div class="registrations-content">
                <h2>Sign up</h2>
                <p class="registrations-text">бүртгүүлэх</p>
                <span class="registrations-btn">Бүртгүүлэх</span>
            </div>
        </a>
    </div>
</section>

<div id="footer"></div>

<script src="load.js"></script>

</body>
</html>
